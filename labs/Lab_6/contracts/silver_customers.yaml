table: silver.customers
purpose: Conservar clientes validados manteniendo customer_id y customer_unique_id sin agrupar.
grain: Una fila por cada customer_id.
primary_key: [customer_id]
owner: Pudubella
lineage: [bronze.customers]
classification: interno

required_columns:
  - customer_id
  - customer_unique_id
  - customer_zip_code_prefix
  - customer_city
  - customer_state

column_types:
  customer_id: string
  customer_unique_id: string
  customer_zip_code_prefix: integer
  customer_city: string
  customer_state: string

allow_empty: false

constraints:
  customer_id:
    nullable: false
    unique: true
  customer_unique_id:
    nullable: false
  customer_zip_code_prefix:
    nullable: false
  customer_city:
    nullable: false
  customer_state:
    nullable: false