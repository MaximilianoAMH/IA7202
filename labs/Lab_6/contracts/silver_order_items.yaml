table: silver.order_items
purpose: Conservar ítems de órdenes con precios y fletes válidos.
grain: Una fila por ítem dentro de una orden.
primary_key: [order_id, order_item_id]
owner: Pudubella
lineage: [bronze.order_items]
classification: interno

required_columns:
  - order_id
  - order_item_id
  - product_id
  - seller_id
  - shipping_limit_date
  - price
  - freight_value

column_types:
  order_id: string
  order_item_id: integer
  product_id: string
  seller_id: string
  shipping_limit_date: string
  price: float
  freight_value: float

allow_empty: false

constraints:
  order_id:
    nullable: false

  order_item_id:
    nullable: false

  product_id:
    nullable: false

  seller_id:
    nullable: false

  shipping_limit_date:
    nullable: false

  price:
    nullable: false
    minimum: 0
    finite: true

  freight_value:
    nullable: false
    minimum: 0
    finite: true