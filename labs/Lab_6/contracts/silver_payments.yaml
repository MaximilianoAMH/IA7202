table: silver.payments
purpose: Conservar pagos válidos asociados solo a órdenes existentes.
grain: Una fila por secuencia de pago dentro de una orden.
primary_key: [order_id, payment_sequential]
owner: Pudubella
lineage: [bronze.payments]
classification: interno

required_columns:
  - order_id
  - payment_sequential
  - payment_type
  - payment_installments
  - payment_value

column_types:
  order_id: string
  payment_sequential: integer
  payment_type: string
  payment_installments: integer
  payment_value: float

allow_empty: false

constraints:
  order_id:
    nullable: false

  payment_sequential:
    nullable: false

  payment_type:
    nullable: false

  payment_installments:
    nullable: false

  payment_value:
    nullable: false
    minimum: 0
    finite: true
